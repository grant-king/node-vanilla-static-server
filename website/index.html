        var current_audio_source_idx = 0
        var current_audio_source = `${par_bucket_url}${audio_sources[current_audio_source_idx]}`
        const audio_context = new AudioContext()

        const mp3_play_button = document.getElementById("mp3_play_button")
        mp3_play_button.addEventListener("click", handle_play)

        const mp3_pause_button = document.getElementById("mp3_pause_button")
        mp3_pause_button.addEventListener("click", handle_pause)

        const volume_control = document.getElementById("volume_slider")
        volume_control.addEventListener("input", handle_volume_input)

        const panner_control = document.getElementById("panner_slider")
        panner_control.addEventListener("input", handle_pan_input)

        const seek_control = document.getElementById("seek_slider")
        seek_control.addEventListener("input", handle_seek_input)

        add_episode_select_buttons()

        // create a gain node
        const gain_node = audio_context.createGain()

        // create a panner node
        const panner_node = audio_context.createStereoPanner()

        // get the audio element
        const mp3_source = document.getElementById("mp3_source")
        mp3_source.src = current_audio_source
        mp3_source.addEventListener("ended", mp3_ended_callback)
        mp3_source.addEventListener("timeupdate", time_update_callback)

        // pass audio element into the audio context
        const track = audio_context.createMediaElementSource(mp3_source)

        // build the node graph
        track.connect(gain_node).connect(panner_node).connect(audio_context.destination)


        // analyser logic

        const analyser = audio_context.createAnalyser();
        analyser.fftSize = 128;

        const buffer_length = analyser.frequencyBinCount;
        const domain_data_array = new Uint8Array(buffer_length);
        analyser.getByteTimeDomainData(domain_data_array);

        // Connect the source to be analyzed
        track.connect(analyser);

        // Get a canvas defined with ID "oscilloscope"
        const canvas = document.getElementById("oscilloscope");
        const canvas_ctx = canvas.getContext("2d");

        // draw an oscilloscope of the current audio source

        function draw() {
            requestAnimationFrame(draw);

            analyser.getByteTimeDomainData(domain_data_array);

            canvas_ctx.fillStyle = "rgba(128, 128, 128, 0.04)";
            canvas_ctx.fillRect(0, 0, canvas.width, canvas.height);

            canvas_ctx.lineWidth = 2;
            canvas_ctx.strokeStyle = "rgba(32, 32, 32, 0.8)";

            canvas_ctx.beginPath();

            const slice_width = (canvas.width * 1.0) / buffer_length;
            let x = 0;

            for (let i = 0; i < buffer_length; i++) {
                const v = domain_data_array[i] / 128.0;
                const y = (v * canvas.height) / 2;

                if (i === 0) {
                    canvas_ctx.moveTo(x, y);
                } else {
                    canvas_ctx.lineTo(x, y);
                }

                x += slice_width;
            }

            canvas_ctx.lineTo(canvas.width, canvas.height / 2);
            canvas_ctx.stroke();
        }

        draw();

        function add_episode_select_buttons() {
            const button_template = document.getElementById("button_template")

            for (let i = 0; i < audio_sources.length; i++) {
                const button_element = button_template.cloneNode(true)
                button_element.id = `button_${i}`
                const button_text_p = button_element.querySelector('p')
                button_text_p.innerText = String(i).padStart(3, 0)
                if (i == 0) {
                    button_text_p.classList.remove("bg-amber-200")
                    button_text_p.classList.add("bg-lime-200")
                }
                // add click event listener
                button_element.addEventListener("click", (event) => {
                    handle_select_episode(event, i)
                })
                button_template.before(button_element)
            }

            button_template.remove()
        }

        function handle_play(event) {
            if (audio_context.state === "suspended") {
                audio_context.resume()
                console.log("resume")
            }
            mp3_source.play()

        }

        function handle_pause(event) {
            mp3_source.pause()
        }

        function handle_volume_input(event) {
            gain_node.gain.value = volume_control.value
        }

        function handle_pan_input(event) {
            panner_node.pan.value = panner_control.value
        }

        function mp3_ended_callback(event) {
            console.log("mp3 has finished :: ", event)
            let new_source_idx = current_audio_source_idx
            if (current_audio_source_idx < audio_sources.length - 1) {
                new_source_idx++
            } else {
                new_source_idx = 0
            }
            handle_select_episode(event, new_source_idx)
        }

        function handle_select_episode(event, source_idx) {
            const previous_button_element = document.getElementById(`button_${current_audio_source_idx}`)
            const previous_button_text_p = previous_button_element.querySelector('p')
            previous_button_text_p.classList.remove("bg-amber-200")
            previous_button_text_p.classList.remove("bg-lime-200")
            previous_button_text_p.classList.add("bg-fuchsia-200")

            const button_element = document.getElementById(`button_${source_idx}`)
            const button_text_p = button_element.querySelector('p')
            button_text_p.classList.remove("bg-amber-200")
            button_text_p.classList.remove("bg-fuchsia-200")
            button_text_p.classList.add("bg-lime-200")

            console.log(source_idx)
            current_audio_source_idx = source_idx
            current_audio_source = `${par_bucket_url}${audio_sources[current_audio_source_idx]}`
            mp3_source.src = current_audio_source
            mp3_source.currentTime = 0
            mp3_source.play()

        }

        function time_update_callback(event) {
            seek_control.value = mp3_source.currentTime / mp3_source.duration
            //console.log(seek_control.value, mp3_source.currentTime, mp3_source.duration)
        }

        function handle_seek_input(event) {
            mp3_source.currentTime = seek_control.value * mp3_source.duration
        }
